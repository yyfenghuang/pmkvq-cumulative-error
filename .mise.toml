# Set VIRTUAL_ENV (and put .venv/bin ahead for interactive `mise exec`) so the
# uv-managed project venv is the active one. Tasks below still invoke `uv run`
# explicitly: an external toolchain on PATH (e.g. ESP-IDF's python) can sit
# ahead of .venv/bin in a task shell and shadow a bare `python`. `uv run`
# resolves the project venv regardless. Run `mise run setup` (uv sync) first.
[env]
_.python.venv = { path = ".venv", create = false }
_.path = [".venv/bin"]

[tools]
python = "3.11"
uv = "latest"

[tasks.setup]
description = "Create venv and install pinned dependencies"
run = "uv sync"

[tasks.test]
description = "All invariants. Silent on pass, exit 0"
run = """
uv run python tests/test_quantizer_floor.py
uv run python tests/test_injection_mask.py
uv run python tests/test_eager_attention.py
uv run python tests/test_fit_recovery.py
"""

[tasks.freeze-predictions]
description = "Hash and lock predictions/h1_predictions.json"
run = "uv run python scripts/freeze_predictions.py"

[tasks.arm-a]
description = "P1 and P4. Teacher forced, feedback off"
depends = ["test", "freeze-predictions"]
run = "uv run python scripts/run_arm_a.py --out results/arm_a.csv"

[tasks.arm-b]
description = "P2. Free running, feedback on"
depends = ["test", "freeze-predictions"]
run = "uv run python scripts/run_arm_b.py --out results/arm_b.csv"

[tasks.arm-c]
description = "P5. Impulse injection, sweep t0"
depends = ["test", "freeze-predictions"]
run = "uv run python scripts/run_arm_c.py --out results/arm_c.csv"

[tasks.bitsweep]
description = "P6. Terminal deviation against bit-width"
depends = ["test", "freeze-predictions"]
run = "uv run python scripts/run_bitsweep.py --out results/bitsweep.csv"

[tasks.fit]
description = "P3. Log-log regression, bootstrap CI, gamma = sqrt(alpha+1)"
depends = ["arm-a", "arm-b", "arm-c", "bitsweep"]
run = "uv run python scripts/fit_all.py --out results/fit.json"

[tasks.gate]
description = "Evaluate fit.json against the frozen predictions"
depends = ["fit"]
run = "uv run python scripts/gate.py --out results/gate.json"

[tasks.assets]
description = "Render every png and gif under assets/"
depends = ["fit"]
run = "uv run python scripts/make_assets.py --outdir assets/"

[tasks.assets-synthetic]
description = "Render the closed-form assets only. No run required"
run = "uv run python scripts/make_assets.py --outdir assets/ --synthetic-only"

[tasks.nb]
description = "Register the kernel, install the nbstripout hook, open the article"
depends = ["setup"]
run = """
uv run python -m ipykernel install --user --name pmkvq-h1
uv run nbstripout --install
uv run jupyter lab pmkvq_cumulative_error.ipynb
"""

[tasks.h1]
description = "Full ladder, artifacts and assets"
depends = ["arm-a", "arm-b", "arm-c", "bitsweep", "fit", "gate", "assets"]

# Constrained one-shot for CPU / personal-repo runs. Keeps the full T-range
# (max_new_tokens stays 4096), so the alpha exponent is NOT biased. Cuts only
# the harmless multipliers: n_sequences 16 -> 4 (the other 12 are bit-identical
# greedy repeats of the 4 unique prompts) and arm-C's t0 grid 12 -> 6 (coarser
# Green's function, not a biased one). Writes the same results/*.csv as `h1`, so
# it OVERWRITES a full run's artifacts. Record the reduced N in notes/deviations.md.
[tasks.h1-lite]
description = "Constrained one-shot (4 prompts, full T-range, coarse arm-C). Not silent."
depends = ["test", "freeze-predictions"]
run = """
echo "[h1-lite] arm-a (teacher forced)"      && uv run python scripts/run_arm_a.py    --out results/arm_a.csv    --n-sequences 4
echo "[h1-lite] arm-b (free running)"        && uv run python scripts/run_arm_b.py    --out results/arm_b.csv    --n-sequences 4
echo "[h1-lite] arm-c (impulse, 6 t0 pts)"   && uv run python scripts/run_arm_c.py    --out results/arm_c.csv    --n-sequences 4 --n-t0 6
echo "[h1-lite] bitsweep (6 widths)"         && uv run python scripts/run_bitsweep.py --out results/bitsweep.csv --n-sequences 4
echo "[h1-lite] fit"                         && uv run python scripts/fit_all.py --out results/fit.json
echo "[h1-lite] gate"                        && uv run python scripts/gate.py   --out results/gate.json
echo "[h1-lite] assets"                      && uv run python scripts/make_assets.py --outdir assets/
echo "[h1-lite] done -> results/{arm_a,arm_b,arm_c,bitsweep,fit,gate}.json/csv, assets/"
"""
